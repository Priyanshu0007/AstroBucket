<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Linear gradients matching the AstroBucket landing page theme -->
    <linearGradient id="astroBucketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Background Element -->
  <circle cx="256" cy="256" r="220" fill="url(#astroBucketGrad)" opacity="0.12" filter="url(#glow)" />

  <!-- The Cosmic Bucket (Outer Shape) -->
  <path d="M160 190 L352 190 L320 400 C318 416, 304 428, 288 428 L224 428 C208 428, 194 416, 192 400 Z" 
        fill="url(#astroBucketGrad)" 
        stroke="#ffffff" 
        stroke-width="12" 
        stroke-linejoin="round" />

  <!-- Rim of the Bucket -->
  <ellipse cx="256" cy="190" rx="96" ry="22" fill="#07070a" stroke="#ffffff" stroke-width="12" />

  <!-- Orbital Ring (Astro-theme representing space/saturn orbit) -->
  <path d="M100 280 C60 250, 60 210, 160 190 C180 186, 210 184, 256 184" 
        fill="none" 
        stroke="url(#ringGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        opacity="0.8" />
  
  <path d="M256 184 C330 184, 450 190, 412 250 C380 300, 240 330, 100 280" 
        fill="none" 
        stroke="url(#ringGrad)" 
        stroke-width="16" 
        stroke-linecap="round" />

  <!-- Stars rising from the bucket (representing assets stored in the S3 bucket) -->
  <!-- Main Star -->
  <path d="M256 100 L262 120 L282 120 L266 132 L272 152 L256 140 L240 152 L246 132 L230 120 L250 120 Z" fill="#ffffff" filter="url(#glow)" />
  
  <!-- Small Star Left -->
  <path d="M185 135 L188 143 L196 143 L190 148 L192 156 L185 151 L178 156 L180 148 L174 143 L182 143 Z" fill="#60a5fa" />
  
  <!-- Small Star Right -->
  <path d="M325 125 L328 133 L336 133 L330 138 L332 146 L325 141 L318 146 L320 138 L314 133 L322 133 Z" fill="#a855f7" />

  <!-- Particle details floating -->
  <circle cx="210" cy="250" r="8" fill="#ffffff" opacity="0.8" />
  <circle cx="300" cy="270" r="6" fill="#ffffff" opacity="0.6" />
  <circle cx="230" cy="340" r="10" fill="#ffffff" opacity="0.5" />
  <circle cx="280" cy="310" r="8" fill="#ffffff" opacity="0.7" />
  
</svg>